<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto;display:block"><title id="t">Thirty steps with the heater on at minus four outside, the door open from step 10 to 20</title><desc id="d">Top: the real room falls from 22 to 17 over ten steps, drops to 2 while the door is open, then climbs back to 8. At steps 5, 13 and 23 two five-step forecasts branch off: the four-weight model drifts high and, from step 13, forecasts a rise while the room is falling; the latent model follows the real room each time. Bottom: the private field sits near zero while the door is closed, jumps to 0.9 the step after it opens, and falls back the step after it closes.</desc><rect width="720" height="470" fill="#0d1117"/><rect x="222.0" y="36" width="174.0" height="272" fill="#1c2430" opacity="0.5"/><rect x="222.0" y="342" width="174.0" height="80" fill="#1c2430" opacity="0.5"/><text x="309.0" y="52.0" font-size="11" fill="#a7b0c0" text-anchor="middle" font-weight="400" >door open</text><line x1="48" y1="308.0" x2="570" y2="308.0" stroke="#1c2430" stroke-width="1"/><text x="40.0" y="312.0" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >0°</text><line x1="48" y1="262.7" x2="570" y2="262.7" stroke="#1c2430" stroke-width="1"/><text x="40.0" y="266.7" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >4°</text><line x1="48" y1="217.3" x2="570" y2="217.3" stroke="#1c2430" stroke-width="1"/><text x="40.0" y="221.3" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >8°</text><line x1="48" y1="172.0" x2="570" y2="172.0" stroke="#1c2430" stroke-width="1"/><text x="40.0" y="176.0" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >12°</text><line x1="48" y1="126.7" x2="570" y2="126.7" stroke="#1c2430" stroke-width="1"/><text x="40.0" y="130.7" font