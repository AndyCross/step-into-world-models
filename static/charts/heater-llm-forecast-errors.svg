<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto;display:block"><title id="t">How far off each five-step forecast of the open-door room was</title><desc id="d">Root mean square error in degrees, lower is better. The 104 model scored 0.53. Claude with the readings only scored 0.66, 0.18 and 0.16 over three runs. Claude with the log scored 0.15, 1.28 and 0.07. The physics-shaped model scored 0.10.</desc><rect width="720" height="280" fill="#0d1117"/><line x1="190.0" y1="30" x2="190.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="190.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >0.0°</text><line x1="260.0" y1="30" x2="260.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="260.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >0.2°</text><line x1="330.0" y1="30" x2="330.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="330.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >0.4°</text><line x1="400.0" y1="30" x2="400.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="400.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >0.6°</text><line x1="470.0" y1="30" x2="470.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="470.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >0.8°</text><line x1="540.0" y1="30" x2="540.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="540.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >1.0°</text><line x1="610.0" y1="30" x2="610.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="610.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >1.2°</text><line x1="680.0" y1="30" x2="680.0" y2="228" stroke="#1c2430" stroke-width="1"/><text x="680.0" y="246.0" font-size="11" fill="#6f7a8c" text-anchor="middle" font-weight="400" >1.4°</text><text x="680.0" y="264.0" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >forecast error (RMSE), lower is better</text><line x1="190" y1="30" x2="190" y2="228" stroke="#2c3542" stroke-width="1"/><text x="178.0" y="55.8" font-size="12" fill="#e4e9f2" text-anchor="end" font-weight="600" >104 model</text><text x="178.0" y="69.8" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >same answer every time</text><circle cx="373.8" cy="54.8" r="6" fill="#d95926" stroke="#0d1117" stroke-width="2"><title>104 model: 0.53°</title></circle><text x="385.8" y="58.8" font-size="12" fill="#a7b0c0" text-anchor="start" font-weight="600" >0.53</text><text x="178.0" y="105.2" font-size="12" fill="#e4e9f2" text-anchor="end" font-weight="600" >Claude, readings only</text><text x="178.0" y="119.2" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >three runs</text><circle cx="421.7" cy="104.2" r="6" fill="#8f6fe6" stroke="#0d1117" stroke-width="2"><title>Claude, readings only, run 1: 0.66°</title></circle><circle cx="252.3" cy="104.2" r="6" fill="#8f6fe6" stroke="#0d1117" stroke-width="2"><title>Claude, readings only, run 2: 0.18°</title></circle><circle cx="247.4" cy="104.2" r="6" fill="#8f6fe6" stroke="#0d1117" stroke-width="2"><title>Claude, readings only, run 3: 0.16°</title></circle><text x="433.7" y="108.2" font-size="12" fill="#a7b0c0" text-anchor="start" font-weight="600" >0.66</text><text x="178.0" y="154.8" font-size="12" fill="#e4e9f2" text-anchor="end" font-weight="600" >Claude, with the log</text><text x="178.0" y="168.8" font-size="11" fill="#6f7a8c" text-anchor="end" font-weight="400" >three runs</text><circle cx="243.2" cy="153.8" r="6" fill="#8f6fe6" stroke="#0d1117" stroke-width="2"><title>Claude, with the log, run 1: 0.15°</title></circle><circle cx="638.7" cy="153.8" r="6" fill="#8f6